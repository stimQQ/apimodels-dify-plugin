identity:
  name: generate_video
  author: apimodels
  label:
    en_US: Generate Video
    zh_Hans: 生成视频
description:
  human:
    en_US: Generate a video with any video model on apimodels.app, from text, a first (and last) frame, or reference images. Waits up to 9 minutes; longer jobs return a task ID for Get Task.
    zh_Hans: 用 apimodels.app 上任意视频模型生成视频，支持文生、首（尾）帧、参考图。最多等待 9 分钟；更久的任务返回任务 ID，用「查询任务」接着取。
  llm: Generates a video from a text prompt, optionally with a first frame, a last frame or reference images. Returns the video file and link, or a task ID for the Get Task tool if it is still running after 9 minutes.
parameters:
  - name: prompt
    type: string
    required: false
    form: llm
    label:
      en_US: Prompt
      zh_Hans: 提示词
    human_description:
      en_US: Describe the video. Required by generation models.
      zh_Hans: 描述视频内容。生成类模型必填。
    llm_description: A description of the video to generate, including camera movement and sound if relevant.
  - name: model
    type: dynamic-select
    required: true
    form: llm
    label:
      en_US: Model
      zh_Hans: 模型
    human_description:
      en_US: The list comes live from apimodels.app. Each model has its own resolutions, lengths and inputs; see apimodels.app/docs.
      zh_Hans: 列表实时取自 apimodels.app。每个模型支持的分辨率、时长和输入不同，见 apimodels.app/docs。
    llm_description: The apimodels.app video model ID. Use seedance-2.0-fast unless the user names another model.
  - name: aspect_ratio
    type: select
    required: false
    form: form
    default: auto
    label:
      en_US: Aspect ratio
      zh_Hans: 画幅比例
    human_description:
      en_US: Each model supports its own set of ratios.
      zh_Hans: 每个模型支持的比例不同。
    options:
      - value: auto
        label:
          en_US: auto
      - value: "16:9"
        label:
          en_US: "16:9"
      - value: "9:16"
        label:
          en_US: "9:16"
      - value: "1:1"
        label:
          en_US: "1:1"
      - value: "4:3"
        label:
          en_US: "4:3"
      - value: "3:4"
        label:
          en_US: "3:4"
      - value: "21:9"
        label:
          en_US: "21:9"
  - name: resolution
    type: string
    required: false
    form: form
    label:
      en_US: Resolution
      zh_Hans: 分辨率
    human_description:
      en_US: Optional, as the model's docs write it, for example 480p, 720p or 1080p (Wan 3.0 uses 480P / 720P / 1080P, MiniMax H3 uses 768p / 2k). Higher costs more.
      zh_Hans: 可选，按模型文档的写法填，例如 480p、720p、1080p（万相 3.0 是 480P / 720P / 1080P，MiniMax H3 是 768p / 2k）。越高越贵。
  - name: duration
    type: number
    required: false
    form: form
    min: 1
    max: 30
    label:
      en_US: Length (seconds)
      zh_Hans: 时长（秒）
    human_description:
      en_US: Optional. Each model accepts its own lengths. Longer costs more.
      zh_Hans: 可选。每个模型支持的时长不同，越长越贵。
  - name: first_frame
    type: file
    required: false
    form: llm
    label:
      en_US: First frame
      zh_Hans: 首帧图
    human_description:
      en_US: Optional. The video starts from this image.
      zh_Hans: 可选。视频从这张图开始。
    llm_description: Optional image the video should start from.
  - name: first_frame_url
    type: string
    required: false
    form: llm
    label:
      en_US: First frame link
      zh_Hans: 首帧图链接
    human_description:
      en_US: Optional public image link, used when no first-frame file is given.
      zh_Hans: 可选，公开图片链接，没传首帧文件时使用。
    llm_description: Optional public link to the image the video should start from.
  - name: last_frame
    type: file
    required: false
    form: llm
    label:
      en_US: Last frame
      zh_Hans: 尾帧图
    human_description:
      en_US: Optional. Needs a first frame. Supported by Seedance, Kling, MiniMax H3 Lite, Vidu and others.
      zh_Hans: 可选，需要同时给首帧。Seedance、可灵、MiniMax H3 Lite、Vidu 等支持。
    llm_description: Optional image the video should end on. Only with a first frame.
  - name: last_frame_url
    type: string
    required: false
    form: llm
    label:
      en_US: Last frame link
      zh_Hans: 尾帧图链接
    human_description:
      en_US: Optional public image link, used when no last-frame file is given.
      zh_Hans: 可选，公开图片链接，没传尾帧文件时使用。
    llm_description: Optional public link to the image the video should end on.
  - name: reference_images
    type: files
    required: false
    form: llm
    label:
      en_US: Reference images
      zh_Hans: 参考图
    human_description:
      en_US: Optional, up to 9. Keeps characters, products or style consistent (Seedance, Kling, MiniMax H3, Vidu and others). Cannot be combined with a first frame.
      zh_Hans: 可选，最多 9 张。用于保持人物、商品或风格一致（Seedance、可灵、MiniMax H3、Vidu 等支持）。不能和首帧同时用。
    llm_description: Optional reference images for characters, products or style. Not together with a first frame.
  - name: extra
    type: string
    required: false
    form: form
    label:
      en_US: Extra parameters (JSON)
      zh_Hans: 额外参数（JSON）
    human_description:
      en_US: 'Optional model-specific fields passed through as-is, for example {"generate_audio": false} or {"mode": "prime"}. See the model page on apimodels.app/docs.'
      zh_Hans: '可选，原样透传的模型专属字段，例如 {"generate_audio": false} 或 {"mode": "prime"}。见 apimodels.app/docs 上的模型文档。'
extra:
  python:
    source: tools/generate_video.py
